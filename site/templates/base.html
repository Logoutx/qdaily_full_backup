<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site_description }}{% endblock %}">
<link rel="stylesheet" href="{{ url('static/style.css') }}">
<link rel="alternate" type="application/rss+xml" title="{{ site_title }}" href="{{ url('feed.xml') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url('') }}">{{ site_title }}</a>
  <nav>
    <a href="{{ url('') }}">首页</a>
    {% for y in years %}<a href="{{ url(y ~ '/') }}">{{ y }}</a>{% endfor %}
    {% if has_long_index %}<a href="{{ url('long/') }}">长文章</a>{% endif %}
    {% if has_series_index %}<a href="{{ url('series/') }}">系列</a>{% endif %}
    <a href="{{ url('search/') }}">搜索</a>
    <a href="{{ url('feed.xml') }}">RSS</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <p>QDaily 好奇心日报存档 · 内容来源 <a href="https://web.archive.org/">Internet Archive</a></p>
</footer>
</body>
</html>
