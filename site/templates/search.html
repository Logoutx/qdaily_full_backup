{% extends "base.html" %}
{% block title %}搜索 — {{ site_title }}{% endblock %}
{% block head %}
<link href="{{ url('pagefind/pagefind-ui.css') }}" rel="stylesheet">
<script src="{{ url('pagefind/pagefind-ui.js') }}" defer></script>
{% endblock %}
{% block main %}
<div data-pagefind-ignore="all">
  <h1>搜索</h1>
  <p class="lead">在 {{ total }} 篇文章的标题与正文中查找。支持中文。可按年份和分类筛选结果。</p>
  <div id="search"></div>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      new PagefindUI({
        element: "#search",
        showImages: false,
        excerptLength: 0,
        resetStyles: false,
        showSubResults: false,
        processTerm: function (term) {
          // Force exact-phrase matching per term. Without this, Pagefind
          // falls back to character-substring matching for unmatched
          // CJK queries — e.g. "小红书" surfaces unrelated 书店 / 书屋
          // hits because no doc has "小红书" as a contiguous indexed
          // token (jieba kept it whole, but no 2014-2015 article uses it).
          // The user's typed text and result-count message still show
          // the raw query unchanged; only the underlying Pagefind call
          // sees the quoted form.
          if (!term) return term;
          // Already user-quoted? leave alone.
          if (term.startsWith('"') && term.endsWith('"')) return term;
          return '"' + term.replace(/"/g, '\\"') + '"';
        },
        processResult: function (result) {
          // The hidden index block is jieba-segmented (with spaces), so the
          // auto-generated excerpt looks ugly. Swap in the clean meta excerpt.
          if (result.meta && result.meta.excerpt) {
            result.excerpt = result.meta.excerpt;
          }
          // Prefix a meta line with date / author / category.
          var parts = [];
          if (result.meta) {
            if (result.meta.date) parts.push(result.meta.date);
            if (result.meta.author) parts.push(result.meta.author);
            if (result.meta.category) parts.push(result.meta.category);
          }
          if (parts.length) {
            result.excerpt = '<span class="result-meta">' + parts.join(' · ') +
                             '</span><br>' + (result.excerpt || '');
          }
          return result;
        },
        translations: {
          placeholder: "搜索好奇心日报存档…",
          clear_search: "清空",
          load_more: "加载更多结果",
          search_label: "在站内搜索",
          filters_label: "筛选",
          zero_results: "没有匹配 [SEARCH_TERM] 的结果",
          many_results: "找到 [COUNT] 个匹配 [SEARCH_TERM] 的结果",
          one_result: "找到 1 个匹配 [SEARCH_TERM] 的结果",
          alt_search: "无 [SEARCH_TERM] 的结果，显示 [DIFFERENT_TERM] 的结果",
          search_suggestion: "没有匹配 [SEARCH_TERM] 的结果。请尝试以下搜索：",
          searching: "搜索 [SEARCH_TERM] 中…"
        }
      });
    });
  </script>
</div>
{% endblock %}
