{% extends "base.html" %}
{% block title %}搜索 — {{ site_title }}{% endblock %}
{% block head %}
<link href="{{ url('pagefind/pagefind-ui.css') }}" rel="stylesheet">
<script src="{{ url('pagefind/pagefind-ui.js') }}" defer></script>
{% endblock %}
{% block main %}
<div data-pagefind-ignore="all">
  <h1>搜索</h1>
  <p class="lead">在 {{ total }} 篇文章中查找。支持中文。</p>

  <div class="scope-tabs" role="tablist">
    <button class="scope-tab active" data-scope="all" role="tab" aria-selected="true">搜全文</button>
    <button class="scope-tab" data-scope="title" role="tab" aria-selected="false">只搜标题</button>
    <button class="scope-tab" data-scope="author" role="tab" aria-selected="false">只搜作者</button>
  </div>

  <div id="panel-all" class="search-panel">
    <div id="search"></div>
  </div>

  <div id="panel-meta" class="search-panel" hidden>
    <input type="search" id="meta-q" class="meta-input" autocomplete="off"
           placeholder="搜索好奇心日报存档…">
    <p id="meta-summary" class="result-summary"></p>
    <ul id="meta-results" class="article-list"></ul>
    <p id="meta-more" class="result-more" hidden></p>
  </div>

  <script>
    var BASE_URL = {{ url('') | tojson }};
    var ARTICLES_JSON = {{ url('search/articles.json') | tojson }};

    window.addEventListener("DOMContentLoaded", function () {
      // ---- Pagefind UI for the 搜全文 tab ----
      new PagefindUI({
        element: "#search",
        showImages: false,
        excerptLength: 0,
        resetStyles: false,
        showSubResults: false,
        processTerm: function (term) {
          // The body index is character-segmented for CJK (every Chinese
          // char is its own token; Latin words stay whole). Apply the same
          // segmentation to the query, then quote it so Pagefind treats it
          // as an exact phrase across consecutive tokens — strict substring
          // search for Chinese.
          if (!term) return term;
          if (term.startsWith('"') && term.endsWith('"')) return term;
          var seg = term.replace(/[㐀-䶿一-鿿]/g, function (c) {
            return " " + c + " ";
          }).replace(/\s+/g, " ").trim();
          if (!seg) return term;
          return '"' + seg.replace(/"/g, '\\"') + '"';
        },
        processResult: function (result) {
          if (result.meta && result.meta.excerpt) {
            result.excerpt = result.meta.excerpt;
          }
          var parts = [];
          if (result.meta) {
            if (result.meta.date) parts.push(result.meta.date);
            if (result.meta.author) parts.push(result.meta.author);
            if (result.meta.category) parts.push(result.meta.category);
          }
          var prefix = "";
          if (result.meta && result.meta.is_long) {
            prefix = '<span class="tag long" style="margin-right:.6em">长文章</span>';
          }
          if (parts.length) {
            result.excerpt = prefix + '<span class="result-meta">' + parts.join(' · ') +
                             '</span><br>' + (result.excerpt || '');
          } else if (prefix) {
            result.excerpt = prefix + (result.excerpt || '');
          }
          if (result.meta) {
            var t = result.meta.title;
            result.meta = t ? { title: t } : {};
          }
          return result;
        },
        translations: {
          placeholder: "搜索好奇心日报存档…",
          clear_search: "清空",
          load_more: "加载更多结果",
          search_label: "在站内搜索",
          filters_label: "筛选",
          zero_results: "没有匹配 [SEARCH_TERM] 的结果",
          many_results: "找到 [COUNT] 个匹配 [SEARCH_TERM] 的结果",
          one_result: "找到 1 个匹配 [SEARCH_TERM] 的结果",
          alt_search: "无 [SEARCH_TERM] 的结果，显示 [DIFFERENT_TERM] 的结果",
          search_suggestion: "没有匹配 [SEARCH_TERM] 的结果。请尝试以下搜索：",
          searching: "搜索 [SEARCH_TERM] 中…"
        }
      });

      // ---- Title / author scope: custom panel against articles.json ----
      var articlesPromise = null;  // lazy
      function loadArticles() {
        if (!articlesPromise) {
          articlesPromise = fetch(ARTICLES_JSON).then(function (r) { return r.json(); });
        }
        return articlesPromise;
      }

      var metaInput = document.getElementById("meta-q");
      var metaSummary = document.getElementById("meta-summary");
      var metaResults = document.getElementById("meta-results");
      var metaMore = document.getElementById("meta-more");
      var currentScope = "all";  // "all" | "title" | "author"

      var SHOW_LIMIT = 100;

      function escapeHtml(s) {
        return (s || "").replace(/[&<>"']/g, function (c) {
          return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
        });
      }

      function highlight(text, query) {
        if (!query) return escapeHtml(text);
        var t = String(text || "");
        var i = t.indexOf(query);
        if (i < 0) return escapeHtml(t);
        return escapeHtml(t.slice(0, i)) +
               '<mark>' + escapeHtml(t.slice(i, i + query.length)) + '</mark>' +
               escapeHtml(t.slice(i + query.length));
      }

      function renderMetaResults(items, q, total) {
        if (!q) {
          metaSummary.textContent = "";
          metaResults.innerHTML = "";
          metaMore.hidden = true;
          return;
        }
        if (total === 0) {
          metaSummary.textContent = "没有匹配 “" + q + "” 的结果";
        } else if (total === 1) {
          metaSummary.textContent = "找到 1 个匹配 “" + q + "” 的结果";
        } else {
          metaSummary.textContent = "找到 " + total + " 个匹配 “" + q + "” 的结果";
        }

        var html = items.map(function (a) {
          var meta = [a.date];
          if (a.author) meta.push(a.author);
          if (a.category) meta.push(a.category);
          var titleHtml = currentScope === "title"
            ? highlight(a.title, q) : escapeHtml(a.title);
          var authorHtml = currentScope === "author"
            ? '<span class="author">' + highlight(a.author, q) + '</span>'
            : (a.author ? '<span class="author">' + escapeHtml(a.author) + '</span>' : '');
          return '' +
            '<li>' +
            '<time datetime="' + a.date + '">' + a.date + '</time>' +
            (a.category ? '<span class="cat">' + escapeHtml(a.category) + '</span>' : '') +
            (a.long ? '<span class="tag long">长文章</span>' : '') +
            '<a href="' + BASE_URL + 'articles/' + a.id + '/">' + titleHtml + '</a>' +
            authorHtml +
            '</li>';
        }).join("");
        metaResults.innerHTML = html;

        if (total > items.length) {
          metaMore.hidden = false;
          metaMore.textContent = "只显示前 " + items.length + " 条；共 " + total + " 条";
        } else {
          metaMore.hidden = true;
        }
      }

      var metaSearchTimer = null;
      function runMetaSearch() {
        if (metaSearchTimer) clearTimeout(metaSearchTimer);
        metaSearchTimer = setTimeout(async function () {
          var q = metaInput.value.trim();
          if (!q) { renderMetaResults([], "", 0); return; }
          var arts = await loadArticles();
          var field = currentScope === "title" ? "title" : "author";
          var matches = [];
          for (var i = 0; i < arts.length; i++) {
            if ((arts[i][field] || "").indexOf(q) >= 0) {
              matches.push(arts[i]);
            }
          }
          // arts is already sorted newest-first by render.py
          renderMetaResults(matches.slice(0, SHOW_LIMIT), q, matches.length);
        }, 150);
      }

      metaInput.addEventListener("input", runMetaSearch);

      // ---- Tab switching ----
      var tabs = document.querySelectorAll(".scope-tab");
      var panelAll = document.getElementById("panel-all");
      var panelMeta = document.getElementById("panel-meta");
      tabs.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var scope = btn.dataset.scope;
          if (scope === currentScope) return;
          currentScope = scope;
          tabs.forEach(function (b) {
            var on = (b === btn);
            b.classList.toggle("active", on);
            b.setAttribute("aria-selected", on ? "true" : "false");
          });
          if (scope === "all") {
            panelAll.hidden = false;
            panelMeta.hidden = true;
          } else {
            panelAll.hidden = true;
            panelMeta.hidden = false;
            metaInput.placeholder = scope === "title" ? "在标题中搜索…" : "在作者中搜索…";
            metaInput.focus();
            runMetaSearch();
          }
        });
      });
    });
  </script>
</div>
{% endblock %}
