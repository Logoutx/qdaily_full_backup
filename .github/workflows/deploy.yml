name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/articles_extracted_*.jsonl'
      - 'data/images.jsonl'
      - 'assets/**'
      - 'site/**'
      - 'tools/render.py'
      - 'tools/install_pagefind.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          python tools/upload_assets_r2.py \
            --bucket qdaily-assets \
            --workers 8

      - name: Render site
        run: |
          python tools/render.py \
            --base-url "/" \
            --site-url "https://www.qdaily.org" \
            --asset-base-url "https://cdn.qdaily.org" \
            --image-mode local

      - name: Install Pagefind
        run: bash tools/install_pagefind.sh

      - name: Build search index
        run: ./bin/pagefind --site public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
